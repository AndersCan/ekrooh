<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px; font-size: 16px; }
    pre { background: #eee; padding: 10px; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px;">
    <label>
      Topic:
      <input id="topic" value="deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef" style="width: 320px;" />
    </label>
    <button onclick="joinSwarm()">Join Swarm</button>
  </div>

  <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
    <input id="message" placeholder="Type a message…" style="flex: 1; padding: 10px; font-size: 16px;" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <pre id="log"></pre>

  <script>
    // ── Receive events pushed from Bare ──────────────────────────
    window.onBareEvent = async function(jsonStr) {
      if (jsonStr instanceof Blob) {
        jsonStr = await jsonStr.text()
      }
      try {
        const event = JSON.parse(jsonStr)
        switch (event.type) {
          case 'swarm:status':
            log('status', event.data.status)
            break
          case 'swarm:peer':
            log('peer', event.data.peer)
            break
          case 'swarm:data':
            log('recv', `${event.data.peer}: ${event.data.data}`)
            break
          default:
            log(event.type, event.data)
        }
      } catch (e) {
        log('error', 'Failed to parse event: ' + jsonStr)
      }
    }

    // ── Send commands to Bare ─────────────────────────────────────
    function sendToBare(cmd, data) {
      if (window.NativeBridge) {
        NativeBridge.send(JSON.stringify({ cmd, data }))
      } else {
        log('error', 'NativeBridge not found')
      }
    }

    // ── Example actions ───────────────────────────────────────────
    function joinSwarm() {
      const topic = document.getElementById('topic').value.trim()
      if (!topic) {
        log('error', 'Topic is required')
        return
      }

      log('info', 'Joining swarm...')
      sendToBare('swarm:join', { topic })
    }

    function sendMessage() {
      const msg = document.getElementById('message').value.trim()
      if (!msg) return

      sendToBare('swarm:send', { message: msg })
      log('send', msg)
      document.getElementById('message').value = ''
    }

    function log(label, data) {
      const msg = label + ': ' + (typeof data === 'string' ? data : JSON.stringify(data))
      const logEl = document.getElementById('log')
      if (logEl) {
        logEl.textContent += msg + '\n'
      }
      console.log(msg)
    }
  </script>
</body>
</html>
