plugins {
  id "com.android.library"
  id "maven-publish"
}

android {
  namespace = "to.holepunch.bare.android"
  compileSdk = 35
  ndkVersion = "27.2.12479018"

  defaultConfig {
    minSdk = 29
    externalNativeBuild {
      cmake {
        // Compile the in-repo `libnativehelper.so` functional stub (see
        // src/main/cpp/bare_nativehelper_stub.c). This re-provides the one
        // symbol `libbare-kit.so` imports from the Android platform library
        // `libnativehelper.so` (JNI_GetCreatedJavaVMs), which app processes
        // can't otherwise resolve from the classloader namespace (ekrooh#45,
        // #46). Ships in this AAR; `libbare-kit.so` itself comes from the
        // `:bare-kit-runtime` dependency.
        cppFlags ""
        // Link with 16 KB LOAD alignment (Google Play requires it for 64-bit
        // libs). NDK r27 defaults to 4 KB, so this must be explicit.
        arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  // android.util.Log and friends return defaults in JVM unit tests instead of
  // throwing, so debug-only logging in error paths can be exercised.
  testOptions {
    unitTests.returnDefaultValues = true
  }

  // Generate BuildConfig so host logging can be gated on BuildConfig.DEBUG.
  buildFeatures {
    buildConfig true
  }

  // Ship consumer ProGuard rules so R8 in consumer apps keeps the host API
  // surface and the Bare Kit IPC entry points (see consumer-rules.pro).
  buildTypes {
    release {
      consumerProguardFiles "consumer-rules.pro"
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
      withJavadocJar()
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

// The Bare Kit runtime (libbare-kit.so per ABI + its classes.jar, ~70 MB) is
// NOT in this AAR: it ships as io.github.anderscan.ekrooh:bare-kit-runtime,
// published only when bare-kit is bumped, and reaches consumers as a normal
// POM dependency (docs/adr/0007-separate-bare-kit-runtime-artifact.md).

// --- Public API dump (stability contract, vision.md) -------------------------
// The Kotlin host public API is a stability boundary: removing or changing a
// public signature is a major-version event. `apiDump` writes the public and
// protected JVM signatures of the release compile jar (what consumers link
// against) to api/bare-host.api, which is committed. `apiCheck` (part of
// `check`, so `./gradlew build` runs it) fails when the compiled API no longer
// matches the dump: an intended additive change is accepted by re-running
// `./gradlew :bare-host:apiDump` and committing the diff, which makes every API
// change visible in review.
//
// This uses javap rather than the Kotlin binary-compatibility-validator because
// BCV does not recognise AGP 9's built-in Kotlin, and KGP's own abiValidation
// is not available for Android libraries yet.
def apiCompileJar = layout.buildDirectory.file(
  "intermediates/compile_library_classes_jar/release/bundleLibCompileToJarRelease/classes.jar")
def apiGenerated = layout.buildDirectory.file("api/bare-host.api")
def apiCommitted = file("api/bare-host.api")

tasks.register("apiBuild") {
  description = "Writes the public JVM API of the release compile jar to build/api/bare-host.api."
  dependsOn "bundleLibCompileToJarRelease"
  inputs.file(apiCompileJar)
  outputs.file(apiGenerated)
  doLast {
    def jar = apiCompileJar.get().asFile
    def classes = project.zipTree(jar).matching { include "**/*.class" }.files.collect { f ->
      def path = f.path.replace(File.separatorChar, '/' as char)
      path.substring(path.indexOf("to/holepunch/")).replace(".class", "").replace('/', '.')
    }.findAll { name ->
      def simple = name.substring(name.lastIndexOf('.') + 1)
      !(simple == "R" || simple.startsWith('R$'))
    }.sort()
    def javap = new File(System.getProperty("java.home"), "bin/javap").absolutePath
    def out = new ByteArrayOutputStream()
    project.providers.exec {
      commandLine([javap, "-protected", "-cp", jar.absolutePath] + classes)
    }.standardOutput.asText.get().eachLine { out.write((it + "\n").getBytes("UTF-8")) }
    // One block per class; keep only public/protected classes and drop
    // compiler-generated accessors.
    def blocks = []
    def current = null
    out.toString("UTF-8").eachLine { line ->
      if (line.startsWith("Compiled from")) {
        current = []
        blocks << current
      } else if (current != null && !line.contains('access$')) {
        current << line
      }
    }
    def kept = blocks.findAll { b -> !b.isEmpty() && (b[0].startsWith("public ") || b[0].startsWith("protected ")) }
    def text = kept.collect { it.join("\n") }.sort().join("\n\n") + "\n"
    def target = apiGenerated.get().asFile
    target.parentFile.mkdirs()
    target.setText(text, "UTF-8")
  }
}

tasks.register("apiDump") {
  description = "Updates the committed public API dump (api/bare-host.api)."
  dependsOn "apiBuild"
  doLast {
    apiCommitted.parentFile.mkdirs()
    apiCommitted.setText(apiGenerated.get().asFile.getText("UTF-8"), "UTF-8")
  }
}

tasks.register("apiCheck") {
  description = "Fails when the public API differs from api/bare-host.api."
  group = "verification"
  dependsOn "apiBuild"
  inputs.file(apiGenerated)
  inputs.file(apiCommitted)
  doLast {
    def expected = apiCommitted.exists() ? apiCommitted.getText("UTF-8") : ""
    def actual = apiGenerated.get().asFile.getText("UTF-8")
    if (expected != actual) {
      throw new GradleException(
        "The :bare-host public API changed (stability contract, vision.md). " +
        "Compare build/api/bare-host.api with api/bare-host.api. If the change " +
        "is intended and additive, run ./gradlew :bare-host:apiDump and commit it; " +
        "removing or changing a public signature is a major-version event.")
    }
  }
}

tasks.named("check") { dependsOn "apiCheck" }

// Single source of truth for the version is the root package.json (RELEASING.md).
rootProject.ext.jsonVersion = {
  def slurper = new groovy.json.JsonSlurper()
  def pkg = slurper.parseText(file("../package.json").getText("UTF-8"))
  return pkg.version as String
}

dependencies {
  // Bare Kit runtime (IPC + Worklet classes and native libs). Published as
  // io.github.anderscan.ekrooh:bare-kit-runtime:<lock `maven` pin>, so the
  // generated POM names it like any other dependency.
  api project(":bare-kit-runtime")
  // Public API of the host surfaces these types (BareWebViewClient,
  // BarePortMessenger), so they are `api` for consumers.
  api "androidx.webkit:webkit:1.18.0"
  api "androidx.appcompat:appcompat:1.8.0"
  // ContextCompat for real runtime permission checks (core.permissions).
  implementation "androidx.core:core-ktx:1.19.1"

  testImplementation "junit:junit:4.13.2"
  // Real org.json for unit tests (shadows the android.jar stub).
  testImplementation "org.json:json:20260814"
}

// The AAR is published (to Maven Central and GitHub Packages) under the single
// framework version from the root package.json (see RELEASING.md). Gradle only
// writes it to the local staging repository; publish-maven.sh signs and
// uploads it.
afterEvaluate {
  publishing {
    publications {
      mavenAar(MavenPublication) {
        groupId = "io.github.anderscan.ekrooh"
        artifactId = "bare-host"
        version = rootProject.jsonVersion()
        // `from components.release` (not a bare `artifact(...)`) so the
        // generated POM carries the module's dependency metadata — without it
        // the published POM has no <dependencies> at all and consumers fail
        // to compile on WebViewCompat/appcompat (see GitHub issue #36). The
        // release variant contributes the AAR plus the `api`/`implementation`
        // dependencies and AGP's auto-generated `releaseSourcesJar` /
        // `releaseJavadocJar` (classifiers `sources`/`javadoc`). Adding custom
        // sources/javadoc artifacts here would duplicate those and make the
        // signed publication fail with "multiple artifacts with the identical
        // extension and classifier ('jar.asc', 'sources')" (hit on v0.4.0).
        from components.release

        pom {
          name = "io.github.anderscan.ekrooh:bare-host"
          description = "Android host library for the @ekrooh/bare runtime: IPC coordinator, host plugin registry, WebView client."
          rootProject.ekroohPom(delegate)
        }
      }
    }
    repositories {
      rootProject.ekroohStagingRepo(delegate)
    }
  }
}

// Sources + javadoc jars are mandatory for Maven Central validation. These
// come from AGP's `android.publishing.singleVariant("release")` with
// `withSourcesJar()` + `withJavadocJar()` (declared above): AGP wires the
// auto-generated source/javadoc jars (`releaseSourcesJar` / `javaDocReleaseJar`)
// into the publication as `sources` / `javadoc` classifiers, so no custom jar
// tasks or `artifact(...)` entries are needed (the latter of which previously
// collided with AGP's own artifacts — "multiple artifacts with the identical
// extension and classifier ('jar.asc', 'sources')" on v0.4.0). The javadoc jar
// zips the source dirs (an empty-but-present doc jar satisfies the portal).
