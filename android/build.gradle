plugins {  id "com.android.library"
  id "org.jetbrains.kotlin.android"
  id "maven-publish"
  id "signing"
}

android {
  namespace = "to.holepunch.bare.android"
  compileSdk = 35
  ndkVersion = "27.2.12479018"

  defaultConfig {
    minSdk = 29
    externalNativeBuild {
      cmake {
        // Compile the in-repo `libnativehelper.so` functional stub (see
        // src/main/cpp/bare_nativehelper_stub.c). This re-provides the one
        // symbol `libbare-kit.so` imports from the Android platform library
        // `libnativehelper.so` (JNI_GetCreatedJavaVMs), which app processes
        // can't otherwise resolve from the classloader namespace (ekrooh#45,
        // #46). Shipped alongside `libbare-kit.so` in the AAR.
        cppFlags ""
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  // Generate BuildConfig so host logging can be gated on BuildConfig.DEBUG.
  buildFeatures {
    buildConfig true
  }

  // Ship consumer ProGuard rules so R8 in consumer apps keeps the host API
  // surface and the Bare Kit IPC entry points (see consumer-rules.pro).
  buildTypes {
    release {
      consumerProguardFiles "consumer-rules.pro"
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs "../prebuilds/android/bare-kit/jni"
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
      withJavadocJar()
    }
  }
}

// The Bare Kit runtime is shipped in the published AAR: AGP packages the local
// `api fileTree` jar into the AAR's libs/ and the native libs (jniLibs) into
// jni/, so published consumers need no separate prebuilds download.

// Single source of truth for the version is the root package.json (RELEASING.md).
rootProject.ext.jsonVersion = {
  def slurper = new groovy.json.JsonSlurper()
  def pkg = slurper.parseText(file("../package.json").getText("UTF-8"))
  return pkg.version as String
}

dependencies {
  // Bare Kit runtime prebuilt (IPC + Worklet). Compile/runtime for local
  // project dependents; published consumers get the classes from the AAR's
  // libs/ (AGP packages this local jar into the AAR).
  api fileTree(dir: "../prebuilds/android", include: ["bare-kit/classes.jar"])
  // Public API of the host surfaces these types (BareWebViewClient,
  // BarePortMessenger), so they are `api` for consumers.
  api "androidx.webkit:webkit:1.17.0"
  api "androidx.appcompat:appcompat:1.7.0"
  // ContextCompat for real runtime permission checks (core.permissions).
  implementation "androidx.core:core-ktx:1.13.1"

  testImplementation "junit:junit:4.13.2"
  // Real org.json for unit tests (shadows the android.jar stub).
  testImplementation "org.json:json:20240303"
}

// Publish the AAR to GitHub Packages (Maven format) and Maven Central under
// the single framework version from the root package.json (see RELEASING.md).
afterEvaluate {
  publishing {
    publications {
      mavenAar(MavenPublication) {
        groupId = "io.github.anderscan.ekrooh"
        artifactId = "bare-host"
        version = rootProject.jsonVersion()
        // `from components.release` (not a bare `artifact(...)`) so the
        // generated POM carries the module's dependency metadata — without it
        // the published POM has no <dependencies> at all and consumers fail
        // to compile on WebViewCompat/appcompat (see GitHub issue #36). The
        // release variant contributes the AAR plus the `api`/`implementation`
        // dependencies and AGP's auto-generated `releaseSourcesJar` /
        // `releaseJavadocJar` (classifiers `sources`/`javadoc`). Adding custom
        // sources/javadoc artifacts here would duplicate those and make the
        // signed publication fail with "multiple artifacts with the identical
        // extension and classifier ('jar.asc', 'sources')" (hit on v0.4.0). The
        // local `api fileTree` bare-kit jar is deliberately absent from the POM
        // (file deps can't be resolved from a repo) — its classes ship inside
        // the AAR's libs/.
        from components.release

        pom {
          name = "io.github.anderscan.ekrooh:bare-host"
          description = "Android host library for the @ekrooh/bare runtime: IPC coordinator, host plugin registry, WebView client."
          url = "https://github.com/AndersCan/ekrooh"
          licenses {
            license {
              name = "Apache-2.0"
              url = "https://www.apache.org/licenses/LICENSE-2.0"
              distribution = "repo"
            }
          }
          developers {
            developer {
              id = "AndersCan"
              name = "Anders Can"
              email = "anders.can1@gmail.com"
            }
          }
          scm {
            connection = "scm:git:https://github.com/AndersCan/ekrooh.git"
            developerConnection = "scm:git:git@github.com:AndersCan/ekrooh.git"
            url = "https://github.com/AndersCan/ekrooh"
          }
        }
      }
    }
    repositories {
      maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/AndersCan/ekrooh")
        credentials {
          username = System.getenv("GITHUB_ACTOR") ?: "token"
          password = System.getenv("GITHUB_TOKEN") ?: ""
        }
      }
    }
  }
}

// Sources + javadoc jars are mandatory for Maven Central validation. These
// come from AGP's `android.publishing.singleVariant("release")` with
// `withSourcesJar()` + `withJavadocJar()` (declared above): AGP wires the
// auto-generated source/javadoc jars (`releaseSourcesJar` / `javaDocReleaseJar`)
// into the publication as `sources` / `javadoc` classifiers, so no custom jar
// tasks or `artifact(...)` entries are needed (the latter of which previously
// collided with AGP's own artifacts — "multiple artifacts with the identical
// extension and classifier ('jar.asc', 'sources')" on v0.4.0). The javadoc jar
// zips the source dirs (an empty-but-present doc jar satisfies the portal).

// GPG-sign every publication. CI provides SIGNING_KEY (ASCII-armored private
// key) + SIGNING_PASSWORD as secrets; without them the publish task fails but
// ordinary builds are unaffected. Runs after evaluation so the mavenAar
// publication (declared in afterEvaluate above) already exists.
afterEvaluate {
  signing {
    def signingKey = providers.environmentVariable("SIGNING_KEY").orNull
    def signingPassword = providers.environmentVariable("SIGNING_PASSWORD").orNull
    if (signingKey != null) {
      useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenAar
  }
}
