# Phone sync flow (Starter / android and ios): joins the second peer's room by invite code, votes Tea.
# Needs `-e INVITE=<code>`; run by starter-vote-phone-sync.mjs. It reads the starter's button names and Join box label.
appId: com.example.vote
name: Join a room and vote in the native app
androidWebViewHierarchy: devtools
---
- launchApp:
    label: Open the vote app
# The page navigates once while it loads, and Maestro 2.12.1 throws an IllegalStateException
# (which retry does not catch) if it reads the DOM at that moment. Wait without reading the DOM first.
- evalScript: ${ (function () { var end = Date.now() + 15500; while (Date.now() < end) {} })() }
- extendedWaitUntil:
    label: App shows Tea (0)
    visible: Tea (0)
    timeout: 60000
# On the iOS Simulator the typed text sometimes does not reach the page's input (the box stays
# empty and Join answers "That code does not look right"), so type until the box shows the code.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          label: Focus the invite box
          text: Invite code from another device
      - eraseText:
          label: Clear anything a failed try left in the box
      - inputText:
          label: Type the second peer's invite code
          text: ${INVITE}
      - assertVisible:
          label: The invite box shows the code
          text: ${INVITE}
# The soft keyboard covers the Join button on the emulator's small screen.
# Android only: hideKeyboard fails on the iOS Simulator, and a tap on the "Vote" heading there
# lands on the Water button (its element spans the page). Join stays visible above the iOS keyboard.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    label: Join the second peer's room
    text: Join
# Status text that only shows after a successful Join (the Join box keeps the typed code when it fails).
- extendedWaitUntil:
    label: Phone is in the second peer's room
    visible: 'Joined\. Looking for the other device…|1 other device connected'
    timeout: 15000
- tapOn:
    label: Vote Tea
    text: Tea (0)
- extendedWaitUntil:
    label: Count goes up to Tea (1)
    visible: Tea (1)
    timeout: 15000
- takeScreenshot: phone-after-vote
