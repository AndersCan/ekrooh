name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group: # required `Analyze (...)` checks must report in a merge queue
  schedule:
    # Weekly scheduled scan (issue #66).
    - cron: '31 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        # JS (web + runtime) and Kotlin (Android host) — issue #66.
        language: ['javascript-typescript', 'kotlin']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      # Kotlin analysis needs a real compile of the Android host, which the
      # Stock autobuild cannot do (no Android SDK on PATH, and its gradle run
      # shells out to `npm` for the example web assets). Build the host module
      # explicitly, mirroring the `android` job in test.yml.
      - name: Set up Android SDK (kotlin)
        if: matrix.language == 'kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      # The Bare Kit runtime (to.holepunch.bare.kit.IPC + Worklet) ships as a
      # prebuilt jar in prebuilds/android/bare-kit/classes.jar (gitignored,
      # fetched from holepunchto/bare-kit releases). The android host compiles
      # against it via `api fileTree(...)`, so CodeQL's kotlin analysis must have
      # the jar on its classpath or `IPC` (and its `write` method) won't resolve
      # — which is exactly issue #137. The normal Test `android` job fetches it
      # with `npm run prebuilds` first; this job skipped that step, so warm the
      # prebuilds here, mirroring test.yml.
      - name: Fetch Bare Kit prebuilds (kotlin)
        if: matrix.language == 'kotlin'
        run: npm run prebuilds

      - name: Build Kotlin host for analysis (kotlin)
        if: matrix.language == 'kotlin'
        run: ./gradlew --no-daemon :bare-host:compileDebugKotlin

      - name: Autobuild (javascript-typescript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
