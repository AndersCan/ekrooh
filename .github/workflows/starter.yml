name: Starter
on:
  push:
    branches:
      - main
    paths:
      - 'examples/vote/**'
      - .github/workflows/starter.yml
      - .github/scripts/starter-vote-journey.mjs
  pull_request:
    branches:
      - main
    paths:
      - 'examples/vote/**'
      - .github/workflows/starter.yml
      - .github/scripts/starter-vote-journey.mjs
      # The web job installs this PR's @ekrooh/bare, so package changes run it too.
      - 'core/**'
      - 'plugins/**'
      - 'web/**'
      - package.json
      - package-lock.json
      - vite.config.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The starter is copied out of the repo (degit on main, cp on pull requests).
# Pull requests install the PR's packed @ekrooh/bare in the web job; main and the
# Android/iOS jobs use the published npm package and Maven Central AAR, with no token.
jobs:
  changes:
    name: Starter / changes
    runs-on: ubuntu-latest
    outputs:
      starter: ${{ steps.diff.outputs.starter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: diff
        id: diff
        # Android and iOS test only the published package: skip them when a pull
        # request leaves the starter alone. Any git error falls through to true.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
            && git diff --quiet HEAD^1 HEAD -- examples/vote .github/workflows/starter.yml; then
            echo "starter=false" >> "$GITHUB_OUTPUT"
          else
            echo "starter=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Starter / web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node for the repo (Playwright, packing)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install the repo
        run: npm ci

      - name: Pack this PR's @ekrooh/bare
        if: github.event_name == 'pull_request'
        run: |
          # npm 11.20's `npm pack` crashes here (Cannot read properties of null (reading 'edgesOut')), so pack with npm 10.
          npx --yes npm@10.9.9 pack --pack-destination "$RUNNER_TEMP"
          echo "EKROOH_TARBALL=$(ls "$RUNNER_TEMP"/ekrooh-bare-*.tgz)" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npm run playwright:install -- --with-deps

      # The starter runs on its Node floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0

      - name: Get the starter
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp -R examples/vote "$RUNNER_TEMP/my-app"
          else
            npx --yes degit@3.10.1 AndersCan/ekrooh/examples/vote#main "$RUNNER_TEMP/my-app"
          fi
          echo "STARTER_DIR=$RUNNER_TEMP/my-app" >> "$GITHUB_ENV"

      - name: Install, typecheck, build
        run: |
          cd "$STARTER_DIR"
          npm ci
          if [ -n "${EKROOH_TARBALL:-}" ]; then
            npm install --no-save "$EKROOH_TARBALL"
            diff -rq "$GITHUB_WORKSPACE/dist" node_modules/@ekrooh/bare/dist \
              || { echo "the starter is not using this PR's @ekrooh/bare" >&2; exit 1; }
          fi
          npm run typecheck
          npm run build

      - name: Two devices vote
        timeout-minutes: 6
        run: node .github/scripts/starter-vote-journey.mjs "$STARTER_DIR"

  android:
    name: Starter / android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.starter != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Remove preinstalled NDKs
        # The starter must build without an NDK (prebuilt .so files only).
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle" "$ANDROID_SDK_ROOT/ndk" || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true

      - name: Get the starter
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp -R examples/vote "$RUNNER_TEMP/my-app"
          else
            npx --yes degit@3.10.1 AndersCan/ekrooh/examples/vote#main "$RUNNER_TEMP/my-app"
          fi
          echo "STARTER_DIR=$RUNNER_TEMP/my-app" >> "$GITHUB_ENV"

      - name: Sync
        run: |
          cd "$STARTER_DIR"
          npm ci
          npm run sync

      - name: Build the debug APK
        run: cd "$STARTER_DIR/android" && ./gradlew assembleDebug

      - name: APK carries the bundle, the page and the native libraries
        run: |
          cd "$STARTER_DIR/android"
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk.txt
          grep -q 'assets/main.core.bundle' apk.txt || { echo "APK has no assets/main.core.bundle" >&2; exit 1; }
          grep -q 'assets/web/index.html' apk.txt || { echo "APK has no assets/web/index.html" >&2; exit 1; }
          grep -q 'lib/arm64-v8a/libbare-kit.so' apk.txt || { echo "APK has no lib/arm64-v8a/libbare-kit.so" >&2; exit 1; }
          grep 'lib/arm64-v8a/lib.*\.so' apk.txt | grep -qv 'libbare-kit.so' || { echo "APK has no native addon besides libbare-kit.so" >&2; exit 1; }

  ios:
    name: Starter / ios
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.starter != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Get the starter
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp -R examples/vote "$RUNNER_TEMP/my-app"
          else
            npx --yes degit@3.10.1 AndersCan/ekrooh/examples/vote#main "$RUNNER_TEMP/my-app"
          fi
          echo "STARTER_DIR=$RUNNER_TEMP/my-app" >> "$GITHUB_ENV"

      - name: Sync
        run: |
          cd "$STARTER_DIR"
          npm ci
          npm run sync

      - name: Build for the iOS Simulator
        run: |
          cd "$STARTER_DIR"
          xcodebuild -project ios/Vote.xcodeproj -scheme Vote -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
