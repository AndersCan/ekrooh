name: Playwright Tests
# No workflow-level paths filter: `test` is a required check, and a workflow
# skipped by `paths-ignore` never reports. Docs-only changes skip the job via
# the `changes` gate instead (a skipped job counts as passing).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group: # required check `test` must report in a merge queue

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: node .github/scripts/changed-code.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}

  test:
    needs: changes
    # Fail-safe: runs unless the diff is known to be docs-only, including
    # when the `changes` job itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        # On Linux, --with-deps installs apt libraries the browser needs.
        # Uses repo-local .playwright-browsers (see scripts/playwright-local-browsers.mjs).
        run: npm run playwright:install -- --with-deps
      - name: Run Playwright tests (mock transport)
        run: npm run test:e2e:web
      - name: Run Playwright tests (multi-instance harness)
        run: npm run test:e2e:harness
      - name: Run Playwright tests (consumer example, real stack)
        # Boots the consumer worklet under `bare` serving the built web app,
        # the same-origin topology that runs on device.
        run: npm run test:e2e:consumer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
