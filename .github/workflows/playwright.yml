name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        # On Linux, --with-deps installs apt libraries the browser needs.
        # Uses repo-local .playwright-browsers (see scripts/playwright-local-browsers.mjs).
        run: npm run playwright:install -- --with-deps
      - name: Run Playwright tests (mock transport)
        run: npm run test:e2e:web
      - name: Run Playwright tests (multi-instance harness)
        run: npm run test:e2e:harness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
