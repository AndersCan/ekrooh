name: Playwright Tests
on:
  push:
    branches: [main, master]
    paths-ignore: &docs_only
      - '**.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    branches: [main, master]
    paths-ignore: *docs_only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        # On Linux, --with-deps installs apt libraries the browser needs.
        # Uses repo-local .playwright-browsers (see scripts/playwright-local-browsers.mjs).
        run: npm run playwright:install -- --with-deps
      - name: Run Playwright tests (mock transport)
        run: npm run test:e2e:web
      - name: Run Playwright tests (multi-instance harness)
        run: npm run test:e2e:harness
      - name: Run Playwright tests (consumer example, real stack)
        # Boots the consumer worklet under `bare` serving the built web app,
        # the same-origin topology that runs on device.
        run: npm run test:e2e:consumer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
