name: Test
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  js:
    name: JS (check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the npm package (dist — check/test resolve via exports)
        run: npm run build:pkg

      - name: Format, lint and type-check
        run: npm run check

      - name: Unit tests (enforces the coverage floor)
        run: npm run test:unit -- --coverage

  android:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            platform: android
          - os: macos-latest
            host: darwin
            platform: android
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Gradle build (includes host JUnit tests)
        run: ./gradlew build

  # android-emulator / p2p verify is DISABLED pending issue #44.
  # The job previously spun forever on `adb: device offline` (the emulator boots
  # but adb never reports it online) and rang to the 6h default timeout,
  # hanging CI on every run — before any test executes, and unrelated to the
  # code under test. Retrying such an unbounded loop would only hang CI longer,
  # so the job is disabled outright (see #44) until the boot/offline loop has a
  # bounded timeout. The peer-drive replication gate still runs on the macOS
  # smoke + iOS simulator. Re-enable with a bounded boot wait, not a retry
  # matrix.
