name: Test
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  js:
    name: JS (check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint and type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

  android:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            platform: android
          - os: macos-latest
            host: darwin
            platform: android
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Gradle build (includes host JUnit tests)
        run: ./gradlew build
