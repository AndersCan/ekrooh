name: Test
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  js:
    name: JS (check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the npm package (dist — check/test resolve via exports)
        run: npm run build:pkg

      - name: Format, lint and type-check
        run: npm run check

      - name: Unit tests (enforces the coverage floor)
        run: npm run test:unit -- --coverage

  android:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            platform: android
          - os: macos-latest
            host: darwin
            platform: android
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Gradle build (includes host JUnit tests)
        run: ./gradlew build

  android-emulator:
    name: android-emulator (p2p verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Run the on-device p2p verify instrumentation test (issue #41)
        # Boots `core/p2p-verify.core.ts` on an Android emulator in `mode=self`
        # (self-contained corestore/hyperdrive smoke): proves the p2p native
        # addons load and self-read on Android bare-kit. Real DHT peer
        # discovery (server:true sockets reachable from a peer) is unreliable
        # under the software-rendered x86_64 CI emulator, so the full
        # peer-drive replication gate runs on the macOS smoke and the iOS
        # simulator instead — the Android gate is the deterministic addon-load
        # assertion.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :examples:android-app:connectedDebugAndroidTest

      - name: Assert the published POM carries the api dependencies
        # Regression guard for GitHub issue #36: the bare-host POM used to be
        # published with no <dependencies> at all (consumers failed to compile
        # on WebViewCompat/appcompat). Fail the build if the generated POM
        # drops the androidx deps again.
        run: |
          ./gradlew :bare-host:generatePomFileForMavenAarPublication
          POM=android/build/publications/mavenAar/pom-default.xml
          grep -q "androidx.webkit" "$POM" || { echo "POM is missing androidx.webkit — see issue #36"; exit 1; }
          grep -q "androidx.appcompat" "$POM" || { echo "POM is missing androidx.appcompat — see issue #36"; exit 1; }
          echo "POM dependency metadata OK"

  ios:
    runs-on: macos-latest
    name: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build iOS app inputs (addons, bundle, web assets, xcodeproj)
        run: npm run build:ios

      - name: iOS XCTest + UI test on the simulator
        run: npm run test:ios
