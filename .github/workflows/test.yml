name: Test
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  js:
    name: JS (check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the npm package (dist — check/test resolve via exports)
        run: npm run build:pkg

      - name: Format, lint and type-check
        run: npm run check

      - name: Unit tests (enforces the coverage floor)
        run: npm run test:unit -- --coverage

  android:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            platform: android
          - os: macos-latest
            host: darwin
            platform: android
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.host }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Gradle build (includes host JUnit tests)
        run: ./gradlew build

  android-pom:
    name: android-pom (published POM carries api dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Assert the published POM carries the api dependencies
        # Regression guard for GitHub issue #36: the bare-host POM used to be
        # published with no <dependencies> at all (consumers failed to compile
        # on WebViewCompat/appcompat). Fail the build if the generated POM
        # drops the androidx deps again.
        run: |
          ./gradlew :bare-host:generatePomFileForMavenAarPublication
          POM=android/build/publications/mavenAar/pom-default.xml
          grep -q "androidx.webkit" "$POM" || { echo "POM is missing androidx.webkit — see issue #36"; exit 1; }
          grep -q "androidx.appcompat" "$POM" || { echo "POM is missing androidx.appcompat — see issue #36"; exit 1; }
          echo "POM dependency metadata OK"

  # Re-enabled with hard bounds (issue #44). The job used to spin forever on
  # `adb: device offline` and ride the 6h default timeout. It is now bounded at
  # the job level and at the emulator boot, and uses hardware acceleration (KVM)
  # so the emulator comes online instead of sitting offline. Do not "fix" a red
  # run here with a retry matrix: read the log, fix the cause.
  android-emulator:
    name: android-emulator (p2p verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JS and web assets for Android
        run: npm run build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the on-device p2p verify instrumentation test (issue #41)
        # Boots `core/p2p-verify.core.ts` on an Android emulator in `mode=self`
        # (self-contained corestore/hyperdrive smoke): proves the p2p native
        # addons load and self-read on Android bare-kit. The full peer-drive
        # replication gate runs in the `p2p` job and on the iOS simulator.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          cores: 4
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          # On failure dump the device log (the emulator is gone once this step
          # ends) so a crashed instrumentation process is diagnosable from CI.
          script: |
            adb logcat -c
            ./gradlew :examples:android-app:connectedDebugAndroidTest || { adb logcat -d -t 1500 > logcat.txt; grep -iE "fatal|crash|signal|abort|dlopen|UnsatisfiedLink|bare|p2p" logcat.txt | tail -120; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: android-emulator-reports
          path: |
            examples/android-app/build/reports/androidTests/
            logcat.txt
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-latest
    name: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build iOS app inputs (addons, bundle, web assets, xcodeproj)
        run: npm run build:ios

      - name: iOS XCTest + UI test on the simulator
        run: npm run test:ios

  # Supply-chain / vulnerability scanning (issue #66).
  dependency-scan:
    name: Dependency / vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (for audit)
        run: npm ci

      - name: npm audit (high+)
        # Fail closed on high-severity advisories in the npm lockfile.
        run: npm audit --audit-level=high

      - name: OSV-Scanner (npm + gradle manifests)
        # Scans package.json / package-lock.json and the Gradle build for
        # known vulnerabilities across both ecosystems.
        #
        # The runnable action lives in the `osv-scanner-action/` subpath: since
        # v2.x the root `action.yml` is a redirect stub with no `runs:` section,
        # and pointing `uses:` at the repo root fails with
        # `Top level 'runs:' section is required`. This mirrors the invocation
        # in google/osv-scanner-action's own reusable workflows at v2.5.1.
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --format table
            .

  dependency-review:
    name: Dependency review (PR)
    # Only meaningful on pull requests — diffs the dependency graph against
    # the base branch and fails on newly introduced vulnerable/licensed-unsafe
    # packages.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # Block the merge if a new dependency is added at a vulnerable
          # severity or with a disallowed license.
          fail-on-severity: high
          # False positives: the lockfile records the `vite` override as the
          # alias `npm:@voidzero-dev/vite-plus-core@1.4.0`, which the review
          # misreads as the upstream `vite@1.4.0` (advisories for vite <2.9.13).
          # `npm audit` (the vuln-scan job) resolves the alias correctly and is
          # clean.
          allow-ghsas: GHSA-mv48-hcvh-8jj8, GHSA-353f-5xf4-qw67, GHSA-587h-7wmj-h5pm, GHSA-fx2h-pf6j-xcff, GHSA-c27g-q93r-2cwf
