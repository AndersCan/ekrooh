  ios:
    runs-on: macos-latest
    name: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build iOS app inputs (addons, bundle, web assets, xcodeproj)
        run: npm run build:ios

      - name: iOS XCTest + UI test on the simulator
        run: npm run test:ios

  # Supply-chain / vulnerability scanning (issue #66).
  dependency-scan:
    name: Dependency / vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (for audit)
        run: npm ci

      - name: npm audit (high+)
        # Fail closed on high-severity advisories in the npm lockfile.
        run: npm audit --audit-level=high

      - name: OSV-Scanner (npm + gradle manifests)
        # Scans package.json / package-lock.json and the Gradle build for
        # known vulnerabilities across both ecosystems.
        uses: google/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --format table
            .

  dependency-review:
    name: Dependency review (PR)
    # Only meaningful on pull requests — diffs the dependency graph against
    # the base branch and fails on newly introduced vulnerable/licensed-unsafe
    # packages.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # Block the merge if a new dependency is added at a vulnerable
          # severity or with a disallowed license.
          fail-on-severity: high
