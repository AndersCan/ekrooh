  #       # (self-contained corestore/hyperdrive smoke): proves the p2p native
  #       # addons load and self-read on Android bare-kit. Real DHT peer
  #       # discovery (server:true sockets reachable from a peer) is unreliable
  #       # under the software-rendered x86_64 CI emulator, so the full
  #       # peer-drive replication gate runs on the macOS smoke and the iOS
  #       # simulator instead — the Android gate is the deterministic addon-load
  #       # assertion.
  #       uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
