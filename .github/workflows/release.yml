name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish v${{ github.ref_name }}
    # Protected environment `release`: requires a maintainer reviewer before
    # any publish step runs (issue #54). Maintainers must create the `release`
    # environment in repo Settings → Environments with Required reviewers and
    # a tag protection rule for `v*`. The `id-token: write` top-level
    # permission below is what powers npm trusted publishing (OIDC).
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build core bundle and web assets
        run: npm run build

      - name: Run all gates (JS + Gradle, includes host JUnit)
        run: ./gradlew build

      - name: Publish @ekrooh/bare to npm
        # Trusted publishing (OIDC): `id-token: write` above + the trusted
        # publisher configured on npmjs.com for this workflow. No NPM_TOKEN.
        # Idempotent: skips when this exact version is already on the registry
        # so a partial release can be re-run after a failed later step.
        # npm refuses prerelease versions without an explicit dist-tag: derive
        # it from the version (beta/alpha/rc → that identifier, stable → latest).
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "@ekrooh/bare@$VERSION" version >/dev/null 2>&1; then
            echo "npm: @ekrooh/bare@$VERSION already published — skipping"
            exit 0
          fi
          TAG=$(node -e "const v=require('./package.json').version; const m=v.match(/-([a-z]+)\./); process.stdout.write(m ? m[1] : 'latest')")
          npm publish --access public --tag "$TAG"

      - name: Publish :bare-host AAR to GitHub Packages
        # The publication is signed (see android/build.gradle), so the signing
        # secrets are required here too — not just the Maven Central step.
        # Idempotent: skips when this exact version already exists on GitHub
        # Packages (maven-metadata.xml check with the actions token), so a
        # partial release can be re-run after a failed later step.
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          METADATA="https://maven.pkg.github.com/AndersCan/ekrooh/io/github/anderscan/ekrooh/bare-host/maven-metadata.xml"
          if curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "$METADATA" 2>/dev/null | grep -q "<version>$VERSION</version>"; then
            echo "GitHub Packages: bare-host@$VERSION already published — skipping"
          else
            ./gradlew :bare-host:publishMavenAarPublicationToGitHubPackagesRepository
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish :bare-host AAR to Maven Central
        # Sonatype Central Portal (OSSHR staging API) — no auth for consumers.
        # Requires the io.github.anderscan namespace verified on central.sonatype.com
        # (the io.github.anderscan.ekrooh groupId is a permitted sub-namespace) and
        # these secrets: SONATYPE_USERNAME / SONATYPE_PASSWORD (user token from
        # central.sonatype.com -> Account -> Generate User Token) and
        # SIGNING_KEY (ASCII-armored PGP private key) / SIGNING_PASSWORD.
        run: ./gradlew :bare-host:publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
