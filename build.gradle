plugins {
  id "com.android.application" version "8.13.2" apply false
  id "com.android.library" version "8.13.2" apply false
  id "org.jetbrains.kotlin.android" version "1.9.23" apply false
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
}

// Maven Central publication (Sonatype Central Portal via the OSSRH staging
// API). Credentials come from the sonatypeUsername / sonatypePassword Gradle
// properties (CI sets ORG_GRADLE_PROJECT_sonatypeUsername / ...Password).
// See RELEASING.md.
nexusPublishing {
  repositories {
    sonatype {
      nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
      snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
    }
  }
}
