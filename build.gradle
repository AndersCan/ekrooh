plugins {
  id "com.android.application" version "9.5.0" apply false
  id "com.android.library" version "9.5.0" apply false
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
}

// The nexus publish plugin resolves the Sonatype staging profile from the
// root project's group — it must match the published groupId below and the
// namespace verified on central.sonatype.com (RELEASING.md).
group = "io.github.anderscan.ekrooh"

// Maven Central publication (Sonatype Central Portal via the OSSRH staging
// API). Credentials come from the sonatypeUsername / sonatypePassword Gradle
// properties (CI sets ORG_GRADLE_PROJECT_sonatypeUsername / ...Password).
// See RELEASING.md.
nexusPublishing {
  repositories {
    sonatype {
      nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
      snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
    }
  }
}

// Shared POM metadata for every published artifact (Maven Central requires
// license, developer and SCM). Call inside a `pom { }` block.
ext.ekroohPom = { pom ->
  pom.url = "https://github.com/AndersCan/ekrooh"
  pom.licenses {
    license {
      name = "Apache-2.0"
      url = "https://www.apache.org/licenses/LICENSE-2.0"
      distribution = "repo"
    }
  }
  pom.developers {
    developer {
      id = "AndersCan"
      name = "Anders Can"
      email = "anders.can1@gmail.com"
    }
  }
  pom.scm {
    connection = "scm:git:https://github.com/AndersCan/ekrooh.git"
    developerConnection = "scm:git:git@github.com:AndersCan/ekrooh.git"
    url = "https://github.com/AndersCan/ekrooh"
  }
}
