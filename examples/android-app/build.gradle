plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace = "to.holepunch.bare.android"
  compileSdk = 35
  ndkVersion = "27.2.12479018"

  defaultConfig {
    applicationId = "to.holepunch.bare.android"
    minSdk = 29
    targetSdk = 35
    versionCode = 1
    versionName = "1.0"
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      jniLibs.srcDirs "src/main/addons"
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }

  // Release builds ship minified; the default ProGuard file plus the app's
  // rules keep the host API and Bare Kit JNI entry points intact.
  buildTypes {
    release {
      isMinifyEnabled = true
      proguardFiles(
        getDefaultProguardFile("proguard-android-optimize.txt"),
        "proguard-rules.pro",
      )
    }
  }
}

// Helper to get a robust PATH including common locations for node and npm
def getExtendedPath() {
  def paths = [
    "/usr/local/bin",
    "/opt/homebrew/bin",
    "/usr/bin",
    "/bin",
    "/usr/sbin",
    "/sbin"
  ]

  // Add NVM (Node Version Manager) paths if they exist
  def nvmDir = new File(System.getProperty('user.home'), ".nvm/versions/node")
  if (nvmDir.exists()) {
    nvmDir.listFiles().each { dir ->
      if (dir.isDirectory()) {
        def binDir = new File(dir, "bin")
        if (binDir.exists()) paths.add(binDir.absolutePath)
      }
    }
  }

  def systemPath = System.getenv("PATH")
  if (systemPath) {
    paths.addAll(systemPath.split(File.pathSeparator))
  }

  return paths.unique().join(File.pathSeparator)
}

// Root of the JS toolchain: the directory holding package.json, node_modules
// and the npm scripts (`build:core`, `build:web`) that the Exec tasks below
// run. The Gradle root project is the deterministic default (never a hardcoded
// relative depth like "../../" — that silently resolves to the wrong directory
// when this build file is copied into a consumer module at a different depth,
// see GitHub issue #38). Consumers whose npm root differs from the Gradle root
// pass `-Pekrooh.repoDir=<absolute dir>`.
def repoRootProp = providers.gradleProperty("ekroohRepoDir").orNull
project.ext.repoRoot = repoRootProp != null ? file(repoRootProp) : rootProject.projectDir

// Helper to configure an Exec task to run through a shell at the JS repo root.
// NOTE (issue #37): the JS build steps assume a **flat** node_modules layout
// (npm/yarn default, or pnpm with `nodeLinker=hoisted`). Under pnpm's default
// isolated linker, bare-pack cannot resolve through the symlinked virtual store
// and bare-link may link nothing silently.
def configureExec(Exec task, String command) {
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  task.environment "PATH", getExtendedPath()
  task.workingDir project.ext.repoRoot

  if (isWindows) {
    task.commandLine "cmd", "/c", command
  } else {
    // Using bash -c ensures the command is executed in a shell environment
    // where the PATH we set is correctly used to resolve executables.
    task.commandLine "bash", "-c", command
  }
}

tasks.register("link", Exec) {
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def bin = isWindows ? "node_modules\\.bin\\bare-link.cmd" : "node_modules/.bin/bare-link"
  // `--out` is the module's own addons dir (absolute, independent of the
  // working dir); bare-link resolves the deps to link from the cwd package's
  // node_modules. Consumers whose entry package has no direct native-addon
  // deps must pass the app bundle package as the entry:
  //   bare-link --preset android --out <out> <entry-package>
  configureExec(it, "${bin} --preset android --out ${projectDir}/src/main/addons")
  doLast {
    // Regression guard for issue #37: bare-link exits 0 and links nothing when
    // run from a package without direct native-addon deps (or under pnpm's
    // isolated linker) — the APK then ships without the p2p native addons and
    // the worklet aborts at runtime with `dlopen failed`. Fail the build early
    // instead of producing a silently broken APK. bare-link lays the addons
    // out per-ABI (arm64-v8a/, armeabi-v7a/, x86/, x86_64/), so count .so files
    // recursively.
    def addonsDir = file("src/main/addons")
    def linked = []
    if (addonsDir.exists()) {
      addonsDir.listFiles().each { abiDir ->
        if (abiDir.isDirectory()) {
          abiDir.listFiles().each { f ->
            if (f.isFile() && f.name.endsWith(".so")) linked << f
          }
        }
      }
    }
    if (linked.isEmpty()) {
      throw new GradleException(
        "bare-link produced no native addons in ${addonsDir}. " +
        "This usually means the JS toolchain cannot see the native deps: " +
        "run the build from the monorepo root, use a flat node_modules " +
        "(npm/yarn, or pnpm with nodeLinker=hoisted), and if the entry " +
        "package has no direct bare-*/rocksdb/sodium/udx deps, pass it " +
        "explicitly (bare-link --preset android --out ${addonsDir} <entry>). " +
        "See the consumer guide (docs/consumers/android-host-build)."
      )
    }
    logger.lifecycle("bare-link linked ${linked.size()} addon .so file(s) into ${addonsDir}")
  }
}

tasks.register("buildBareJs", Exec) {
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def npm = isWindows ? "npm.cmd" : "npm"
  configureExec(it, "${npm} run build:core")
}

tasks.register("cleanWebAssets", Delete) {
  delete fileTree("src/main/assets/assets") {
    include "main-*.js", "main-*.css"
  }
}

tasks.register("buildWebAssets", Exec) {
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def npm = isWindows ? "npm.cmd" : "npm"
  configureExec(it, "${npm} run build:web")
}

tasks.register("packApp", Exec) {
  dependsOn "buildBareJs"
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def bin = isWindows ? "node_modules\\.bin\\bare-pack.cmd" : "node_modules/.bin/bare-pack"
  // Output lands in the module's own assets dir (absolute); the bundle source
  // `core/main.core.gen.js` is produced by `build:core` at the repo root.
  configureExec(it, "${bin} --preset android --out ${projectDir}/src/main/assets/main.core.bundle ${project.ext.repoRoot}/core/main.core.gen.js")
}

// On-device p2p verification bundle (issue #41): `core/p2p-verify.core.ts`
// (esbuild'd by `build:p2p-verify`, then bare-pack'd) is booted by the
// instrumentation test (`P2PVerifyTest`) to reproduce peer-drive replication
// on the emulator. Dev tooling — never shipped in a release APK surface.
tasks.register("buildP2pVerifyJs", Exec) {
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def npm = isWindows ? "npm.cmd" : "npm"
  configureExec(it, "${npm} run build:p2p-verify")
}

tasks.register("packP2pVerify", Exec) {
  dependsOn "buildP2pVerifyJs"
  def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
  def bin = isWindows ? "node_modules\\.bin\\bare-pack.cmd" : "node_modules/.bin/bare-pack"
  configureExec(it, "${bin} --preset android --out ${projectDir}/src/main/assets/p2p-verify.bundle ${project.ext.repoRoot}/core/p2p-verify.core.gen.js")
}

tasks.register("pack") {
  dependsOn packApp
}

preBuild.dependsOn link, buildWebAssets, pack, packP2pVerify

dependencies {
  implementation project(":bare-host")
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.activity:activity-ktx:1.9.3"
  implementation "com.google.android.material:material:1.12.0"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"

  // Instrumentation tests (P2PVerifyTest boots the on-device p2p verify
  // worklet on the emulator — issue #41 reproduction gate).
  androidTestImplementation "androidx.test:runner:1.5.2"
  androidTestImplementation "androidx.test:core-ktx:1.5.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
