plugins {
  id "com.android.application"
}

android {
  namespace = "com.example.vote"
  compileSdk = 36

  defaultConfig {
    applicationId = "com.example.vote"
    minSdk = 29
    targetSdk = 35
    versionCode = 1
    versionName = "1.0"
  }

  buildFeatures {
    buildConfig = true
  }

  buildTypes {
    // Debug builds load the page from "npm run dev" when it answers at the
    // emulator's address for this computer. The port must match scripts/dev.mjs.
    debug {
      buildConfigField "String", "DEV_SERVER_URL", '"http://10.0.2.2:5173"'
    }
    // Release builds always show the page from "npm run sync".
    release {
      buildConfigField "String", "DEV_SERVER_URL", '""'
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      jniLibs.srcDirs "src/main/addons"
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

// "npm run sync" produces the bundle and the native addons; Gradle only compiles.
def syncedBundle = file("src/main/assets/main.core.bundle")
tasks.register("checkSynced") {
  doLast {
    if (!syncedBundle.exists()) {
      throw new GradleException('Web build not found. Run "npm run sync" in the project folder (the one with package.json), then press Run again.')
    }
  }
}
preBuild.dependsOn "checkSynced"

dependencies {
  implementation "io.github.anderscan.ekrooh:bare-host:0.7.0"
  implementation "androidx.appcompat:appcompat:1.8.0"
}
