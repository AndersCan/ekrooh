# iOS → TestFlight / App Store deployment (template)
#
# Copy this file to `.github/workflows/ios-app-store.yml` in your app repo and
# fill in the placeholders + secrets (see templates/deploy/README.md).
#
#   workflow_dispatch   → archive + export the App Store IPA and upload it to
#                         TestFlight (internal testers). Only users in
#                         DEPLOY_APPROVERS may trigger a run (see below).
#
# Submitting for App Store review (production) requires the `production`
# environment approval gate (only DEPLOY_APPROVERS may approve).
#
# Code signing uses fastlane match (read-only on CI). Run
# `bundle exec fastlane match appstore` once on a Mac to create the
# distribution certificate + App Store provisioning profile.
name: iOS — App Store

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to ship the build
        required: true
        default: testflight
        type: choice
        options: [testflight, appstore]

permissions:
  contents: read

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-upload

env:
  # --- EDIT: app identity ------------------------------------------------------
  APP_IDENTIFIER: to.holepunch.bare.ios # must already exist in App Store Connect
  IOS_PROJECT_PATH: examples/ios-app/ios-app.xcodeproj
  IOS_SCHEME: ios-app
  IOS_INFO_PLIST: examples/ios-app/app/Info.plist
  # Who may trigger deploys via workflow_dispatch — comma-separated GitHub
  # usernames. Anyone not on the list gets a no-op run. Leave "<repo-owner>"
  # replaced with your account (fail-closed until configured).
  DEPLOY_APPROVERS: <repo-owner>

jobs:
  authorize:
    name: Check deploy permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Allow only approved deployers to trigger a run
        id: check
        run: |
          if [ -z "${{ env.DEPLOY_APPROVERS }}" ] || [ "${{ env.DEPLOY_APPROVERS }}" = "<repo-owner>" ]; then
            echo "DEPLOY_APPROVERS is unset or still a placeholder — no one can deploy until set."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "${{ env.DEPLOY_APPROVERS }}" | grep -qw "${{ github.actor }}"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Archive + export IPA
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: macos-15 # macOS 26 broke fastlane — stay on 15 until verified
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate xcodeproj + app inputs (addons, bundles, web assets)
        run: npm run build:ios

      - name: Derive app version
        run: |
          echo "MARKETING_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archive + export App Store IPA
        working-directory: fastlane
        run: bundle exec fastlane ios build_ipa
        env:
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_PROJECT_PATH: ${{ env.IOS_PROJECT_PATH }}
          IOS_SCHEME: ${{ env.IOS_SCHEME }}
          IOS_INFO_PLIST: ${{ env.IOS_INFO_PLIST }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: fastlane/build/ios/app.ipa
          if-no-files-found: error
          retention-days: 14

  testflight:
    name: TestFlight — internal testers
    if: needs.authorize.outputs.allowed == 'true' && inputs.target == 'testflight'
    needs: [build, authorize]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      - uses: actions/download-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios

      - name: Upload to TestFlight (internal)
        working-directory: fastlane
        run: bundle exec fastlane ios testflight
        env:
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          IPA_PATH: build/ios/app.ipa
          CHANGELOG: Test build ${{ github.run_number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  appstore:
    name: Submit for App Store review
    if: needs.authorize.outputs.allowed == 'true' && inputs.target == 'appstore'
    needs: [build, authorize]
    runs-on: macos-15
    timeout-minutes: 30
    environment: production # manual approval gate: only DEPLOY_APPROVERS may approve
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      - uses: actions/download-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios

      - name: Submit for App Store review
        working-directory: fastlane
        run: bundle exec fastlane ios appstore
        env:
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          IPA_PATH: build/ios/app.ipa
          CHANGELOG: Release ${{ github.ref_name }}
          IOS_EXPORT_COMPLIANCE_USES_ENCRYPTION: ${{ vars.IOS_EXPORT_COMPLIANCE_USES_ENCRYPTION }}
          DELIVER_LANGUAGES: ${{ vars.DELIVER_LANGUAGES }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
