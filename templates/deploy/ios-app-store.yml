# iOS → TestFlight / App Store deployment (template)
#
# Copy this file to `.github/workflows/ios-app-store.yml` in your app repo and
# fill in the placeholders + secrets (see templates/deploy/README.md).
#
#   workflow_dispatch   → archive + export the App Store IPA and upload it to
#                         TestFlight (internal testers), or submit it for App
#                         Store review.
#
# The security boundary is GitHub environments, not this file. Anyone with
# write access can dispatch this workflow from a branch where they edited it,
# so every secret lives in an environment whose deployment policy allows only
# the default branch:
#   ios-signing  fastlane match access (MATCH_*), no reviewers needed
#   testflight   an App Store Connect API key that can upload builds
#   production   an App Manager API key + required reviewers
# Repository-level secrets would be readable from any branch: do not use them.
#
# Code signing uses fastlane match (read-only on CI). Run
# `bundle exec fastlane match appstore` once on a Mac to create the
# distribution certificate + App Store provisioning profile.
name: iOS — App Store

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to ship the build
        required: true
        default: testflight
        type: choice
        options: [testflight, appstore]

permissions:
  contents: read

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-upload

env:
  # --- EDIT: app identity ------------------------------------------------------
  APP_IDENTIFIER: to.holepunch.bare.ios # must already exist in App Store Connect
  IOS_PROJECT_PATH: examples/ios-app/ios-app.xcodeproj
  IOS_SCHEME: ios-app
  IOS_INFO_PLIST: examples/ios-app/app/Info.plist

jobs:
  build:
    name: Archive + export IPA
    # Defense in depth only: the environment's branch policy is the gate.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15 # macOS 26 broke fastlane — stay on 15 until verified
    timeout-minutes: 90
    environment: ios-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install npm dependencies
        # This job holds the match credentials: no dependency install script
        # runs. Rebuild only packages you have checked need one (esbuild does).
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds

      - name: Generate xcodeproj + app inputs (addons, bundles, web assets)
        run: npm run build:ios

      - name: Derive app version
        run: |
          echo "MARKETING_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Archive + export App Store IPA
        working-directory: fastlane
        run: bundle exec fastlane ios build_ipa
        env:
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_PROJECT_PATH: ${{ env.IOS_PROJECT_PATH }}
          IOS_SCHEME: ${{ env.IOS_SCHEME }}
          IOS_INFO_PLIST: ${{ env.IOS_INFO_PLIST }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app-ipa
          path: fastlane/build/ios/app.ipa
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Ship to ${{ inputs.target }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    # `testflight` or `production`, each with its own API key; `production`
    # also requires reviewer approval.
    environment: ${{ inputs.target == 'appstore' && 'production' || 'testflight' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3'
          bundler-cache: true # installs from your committed Gemfile.lock
          working-directory: fastlane

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-app-ipa
          path: build/ios

      - name: Upload
        working-directory: fastlane
        env:
          TARGET: ${{ inputs.target }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          IPA_PATH: build/ios/app.ipa
          RUN_NUMBER: ${{ github.run_number }}
          IOS_EXPORT_COMPLIANCE_USES_ENCRYPTION: ${{ vars.IOS_EXPORT_COMPLIANCE_USES_ENCRYPTION }}
          DELIVER_LANGUAGES: ${{ vars.DELIVER_LANGUAGES }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          case "$TARGET" in
            testflight) CHANGELOG="Test build $RUN_NUMBER" bundle exec fastlane ios testflight ;;
            appstore) CHANGELOG="Release $GITHUB_REF_NAME" bundle exec fastlane ios appstore ;;
            *) echo "unknown target: $TARGET" >&2; exit 1 ;;
          esac
