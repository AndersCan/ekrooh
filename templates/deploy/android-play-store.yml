# Android → Google Play Store deployment (template)
#
# Copy this file to `.github/workflows/android-play-store.yml` in your app repo
# and fill in the placeholders + secrets (see templates/deploy/README.md).
#
#   workflow_dispatch   → build the signed AAB, upload to the chosen track:
#                         `internal` (testers) or `production`.
#
# The security boundary is GitHub environments, not this file. Anyone with
# write access can dispatch this workflow from a branch where they edited it,
# so every secret lives in an environment whose deployment policy allows only
# the default branch:
#   android-signing  upload keystore (no reviewers needed)
#   internal         a Play service account that can release to testing
#                    tracks only
#   production       a service account with production rights + required
#                    reviewers
# Repository-level secrets would be readable from any branch: do not use them.
#
# Requires your app module's build.gradle to read `-PversionCode`/`-PversionName`
# and a `release` signingConfig fed by the ANDROID_KEYSTORE_* env vars
# (see README → Android setup).
name: Android — Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: false
        default: internal
        type: choice
        options: [internal, production]

permissions:
  contents: read

concurrency:
  group: android-deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-upload

env:
  # --- EDIT: app identity ----------------------------------------------------
  APPLICATION_ID: to.holepunch.bare.android # must already exist in Play Console
  ANDROID_MODULE: ':examples:android-app' # gradle path of your app module (e.g. ":app")
  AAB_PATH: examples/android-app/build/outputs/bundle/release/app-release.aab

jobs:
  build:
    name: Build signed AAB
    # Defense in depth only: the environment's branch policy is the gate.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018

      - name: Install npm dependencies
        # This job holds the upload keystore: no dependency install script
        # runs. Rebuild only packages you have checked need one (esbuild does).
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Fetch Bare Kit prebuilds
        run: npm run prebuilds

      - name: Build JS core + web assets
        run: npm run build

      - name: Restore the Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build + sign the release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MARKETING_VERSION="$(node -p "require('./package.json').version")"
          ./gradlew "$ANDROID_MODULE:bundleRelease" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="$MARKETING_VERSION"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Upload to ${{ inputs.track }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `internal` or `production`: each holds its own SERVICE_ACCOUNT_JSON;
    # `production` also requires reviewer approval.
    environment: ${{ inputs.track }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-aab
          path: build/aab

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3'
          bundler-cache: true # installs from your committed Gemfile.lock
          working-directory: fastlane

      - name: Upload to Google Play
        working-directory: fastlane
        env:
          TRACK: ${{ inputs.track }}
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          ANDROID_AAB_PATH: build/aab/app-release.aab
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          PLAY_ROLLOUT_FRACTION: ${{ vars.PLAY_ROLLOUT_FRACTION }}
        run: |
          case "$TRACK" in
            internal|production) bundle exec fastlane android "$TRACK" ;;
            *) echo "unknown track: $TRACK" >&2; exit 1 ;;
          esac
